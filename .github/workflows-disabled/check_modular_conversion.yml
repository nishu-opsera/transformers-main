name: check_modular_conversion

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check_modular_conversion:
    name: check_modular_conversion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with quality extras
        run: pip install -e ".[quality]"
      - name: Run modular conversion guardrail
        run: make check-modular-conversion
